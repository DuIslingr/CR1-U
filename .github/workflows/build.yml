# Builds the port on Linux, Windows, macOS, Android and iOS (no game data: the build, the packaging). The
# binaries are the run's artifacts; nothing of the game is in them.
name: build
on:
  push:
    branches: [main, platforms]
    tags: ['v*'] # (a version: the release job publishes the builds)
  pull_request:
  workflow_dispatch:

env:
  MOLTENVK: v1.4.2 # (Khronos's MoltenVK release: macOS bundles it, iOS links it in)

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-2022, name: windows }
          - { os: macos-15, name: macos }
          # DLSS: built and linked to prove it, never uploaded - NVIDIA's NGX library is proprietary and
          # these programs are GPL, so a DLSS build is for one's own use (THIRD_PARTY.md), not an artifact
          - { os: ubuntu-22.04, name: linux-dlss, dlss: true }
          - { os: windows-2022, name: windows-dlss, dlss: true }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Vita save converter tests
        if: runner.os == 'Linux'
        run: python3 tools/test_import_vita_save.py

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev libfaad-dev zlib1g-dev libfreetype-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja # (SDL3, FreeType: built here, static - the .app needs no Homebrew)
      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Vulkan SDK
        # (glslc and the headers everywhere - Ubuntu 22.04 has no glslc package; macOS: MoltenVK, universal - bundled into the .app)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.1
          cache: true
      - name: DLSS SDK
        if: matrix.dlss
        shell: bash
        run: |
          # (NVIDIA's public SDK, its headers and this platform's NGX library and runtime only)
          git clone -q --depth 1 --filter=blob:none --sparse -b v310.9.1 https://github.com/NVIDIA/DLSS.git dlss-sdk
          if [ "$RUNNER_OS" = Windows ]; then
            git -C dlss-sdk sparse-checkout set include lib/Windows_x86_64/x64 lib/Windows_x86_64/rel
            echo "CR_DLSS_ARG=-DCR_DLSS_SDK=$(cygpath -m "$PWD/dlss-sdk")" >> "$GITHUB_ENV"
          else
            git -C dlss-sdk sparse-checkout set --no-cone /include/ /lib/Linux_x86_64/rel/ /lib/Linux_x86_64/libnvsdk_ngx.a
            echo "CR_DLSS_ARG=-DCR_DLSS_SDK=$PWD/dlss-sdk" >> "$GITHUB_ENV"
          fi
          ls dlss-sdk/lib/*

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ env.CR_DLSS_ARG }} ${{ matrix.dlss && '-DCR_DLSS_REQUIRED=ON' || '' }}
      - name: MoltenVK (macOS; Khronos's latest release, over the SDK's)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mvk.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/${{ env.MOLTENVK }}/MoltenVK-macos.tar
          tar -xf "$RUNNER_TEMP/mvk.tar" -C "$RUNNER_TEMP"
      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON "-DCR_MOLTENVK=$RUNNER_TEMP/MoltenVK"
      - name: Build
        run: cmake --build build --parallel
      - name: Native Vita importer tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (Linux)
        if: runner.os == 'Linux' && !matrix.dlss
        run: |
          mkdir -p dist
          cp build/chaosrings build/crtool dist/
          cp README.md LICENSE THIRD_PARTY.md dist/
      - name: AppImage (Linux)
        if: runner.os == 'Linux' && !matrix.dlss
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appdir AppDir -e build/chaosrings -d packaging/linux/chaosrings.desktop -i packaging/linux/chaosrings.png --exclude-library "libvulkan.so*" --output appimage  # (the loader: the system's, with its drivers)
          # (an AppImage runs on the oldest supported LTS too: nothing in it may need a newer glibc than 22.04's 2.35)
          need=$(find AppDir/usr -type f \( -name '*.so*' -o -path '*/bin/*' \) -exec objdump -T {} + 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "the AppImage needs $need"
          [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::needs $need, newer than Ubuntu 22.04's glibc 2.35"; exit 1; }
          mv ./*.AppImage dist/
      - name: Package (Windows)
        if: runner.os == 'Windows' && !matrix.dlss
        shell: bash
        run: |
          mkdir -p dist
          cp build/*.exe dist/
          cp build/*.dll dist/ 2>/dev/null || true
          cp README.md LICENSE THIRD_PARTY.md dist/
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          lipo -info build/chaosrings.app/Contents/MacOS/chaosrings
          ! otool -L build/chaosrings.app/Contents/MacOS/chaosrings | grep -e /opt/homebrew -e /usr/local  # (nothing of Homebrew's)
          lipo -info build/chaosrings.app/Contents/Frameworks/libMoltenVK.dylib build/chaosrings.app/Contents/Frameworks/libvulkan.1.dylib
          test -f build/chaosrings.app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json
          # (MoltenVK's and the loader's licences with them: Apache-2.0 - THIRD_PARTY.md)
          lic=build/chaosrings.app/Contents/Resources/licenses
          mkdir -p "$lic"
          find "$VULKAN_SDK/.." -maxdepth 5 \( -iname 'LICENSE*' -o -iname 'NOTICE*' \) | head -40
          for n in MoltenVK Vulkan-Loader; do
            f=$(find "$VULKAN_SDK/.." -maxdepth 6 -ipath "*$n*" -iname 'LICENSE*' | head -1)
            if [ -n "$f" ]; then cp "$f" "$lic/$n-LICENSE.txt"; else curl -fsSL https://www.apache.org/licenses/LICENSE-2.0.txt -o "$lic/$n-LICENSE.txt"; fi
          done
          [ -f "$VULKAN_SDK/../Licenses/LICENSE.txt" ] && cp "$VULKAN_SDK/../Licenses/LICENSE.txt" "$lic/VulkanSDK-LICENSE.txt"  # (the SDK's: every component's)
          cp LICENSE THIRD_PARTY.md "$lic/"
          ls -la "$lic"
          cp -R build/chaosrings.app dist/
          cp build/crtool dist/
          cp README.md LICENSE THIRD_PARTY.md dist/
      # (packed here: an artifact keeps no file modes - the binaries' and the .app's executables)
      - name: Archive
        if: ${{ !matrix.dlss }}
        shell: bash
        run: |
          mkdir -p upload
          mkdir -p dist/tools dist/docs
          cp tools/import_vita_save.py dist/tools/
          cp docs/VITA_SAVES.md dist/docs/
          n="${{ github.event.repository.name }}"
          cp -R packaging/folders/. dist/  # (the game folder's ios/, android/, vita/, textures/, font/: each with what goes in it)
          case "$RUNNER_OS" in
            Linux) mv dist/*.AppImage "upload/$n-x86_64.AppImage"; tar -czf "upload/$n-linux-x86_64.tar.gz" -C dist . ;;
            Windows) 7z a -tzip -bso0 "upload/$n-windows-x64.zip" ./dist/* ;;
            macOS) (cd dist && zip -qry "../upload/$n-macos-universal.zip" .) ;;
          esac
          ls -la upload
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.dlss }}
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          path: upload

  android:
    runs-on: ubuntu-24.04
    name: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDL3 source (its Java glue and the engine's SDL)
        run: git clone --depth 1 -b release-3.4.20 https://github.com/libsdl-org/SDL.git android/SDL
      - name: Release key (the repository's secrets; a fork's pull request has none - the debug key)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
          gradle assembleRelease --no-daemon -PndkVersion=$(basename "$ANDROID_NDK_LATEST_HOME")
      - name: Signed with the release key (its certificate's SHA-256; else a build can't update the last)
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "certificate SHA-256 digest: ba6bbb588eca05116030984fc62b2679744c788038f5a12580bb1026d4aed33d" certs.txt
          rm -f "$ANDROID_KEYSTORE_FILE"
      - name: Archive
        run: mkdir -p upload && cp android/app/build/outputs/apk/release/app-release.apk "upload/${{ github.event.repository.name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-android
          path: upload

  # iOS (iPhone, iPad): Vulkan through MoltenVK linked in (MetalFX from iOS 16), OpenGL ES 3 the fallback. Built
  # unsigned: the .ipa is signed by whoever sideloads it (AltStore, Sideloadly, ...)
  ios:
    # (Xcode 27.1, the iOS 27.1 SDK: an app linked against an older SDK runs letterboxed - a compatibility
    # box - on a screen newer than its SDK, the iPhone Duo's folded and unfolded both; macos-15's Xcode 16.4
    # and iOS 18 SDK did that to every .ipa until now, whatever the Info.plist said)
    runs-on: xcode-27
    name: ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Vulkan SDK (glslc, to compile the shaders)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.363.1
          cache: true
      - name: MoltenVK (iOS; static)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mvk.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/${{ env.MOLTENVK }}/MoltenVK-ios.tar
          tar -xf "$RUNNER_TEMP/mvk.tar" -C "$RUNNER_TEMP"
      - name: Configure
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          ver=0.7.4
          case "$GITHUB_REF_NAME" in v[0-9]*) ver="${GITHUB_REF_NAME#v}" ;; esac
          cmake -S engine -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON "-DCR_MOLTENVK=$RUNNER_TEMP/MoltenVK" "-DCR_VERSION=$ver"
      - name: Build
        run: cmake --build build --config Release --target chaosrings -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package (an unsigned .ipa)
        run: |
          app=$(find build -path '*Release-iphoneos/chaosrings.app' -maxdepth 4 | head -1)
          test -n "$app"
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|UIFileSharingEnabled|CADisableMinimumFrameDurationOnPhone|CFBundleIconName|AppIcon'
          ls "$app" | grep -iE 'Assets.car|AppIcon' # (the icon: actool's catalog, its PNGs)
          test -f "$app/Assets.car"
          lipo -info "$app/chaosrings"
          otool -L "$app/chaosrings" | grep -E 'Metal|OpenGLES'
          mkdir -p upload Payload
          cp -R "$app" Payload/
          zip -qry "upload/${{ github.event.repository.name }}-ios-unsigned.ipa" Payload
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-ios
          path: upload

  # A version tag (v*): every platform's build - none with DLSS - on a GitHub release, its notes
  # packaging/release-notes.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "${{ github.event.repository.name }} $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
