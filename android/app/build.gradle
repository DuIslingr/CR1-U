// The APK: the engine's libmain.so (SDL3 linked in, built from source) and SDL's own Java glue
// (its android-project's org.libsdl.app, from the same SDL source: SDL3_SOURCE_DIR, else
// android/SDL - a checkout of the tag engine/CMakeLists.txt fetches).
plugins {
    id 'com.android.application'
}

def sdlDir = System.getenv('SDL3_SOURCE_DIR') ?: "${rootDir}/SDL"

android {
    namespace 'local.preservation.chaosrings'
    compileSdk 35
    if (project.hasProperty('ndkVersion')) ndkVersion project.property('ndkVersion')

    defaultConfig {
        applicationId 'local.preservation.chaosrings'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.4.5'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlDir}", '-DANDROID_STL=c++_static'
                targets 'main'
            }
        }
    }
    // The ports' release key (CI: the repository's ANDROID_KEYSTORE_* secrets), so each build installs
    // over the one before it; without it - a fork's build, one's own - the debug key
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') // (PKCS12: the store's)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../engine/CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main { java.srcDirs += "${sdlDir}/android-project/app/src/main/java" }
    }
}
